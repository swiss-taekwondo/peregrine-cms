name: Enforce PR Size Limit

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-pr-size:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Calculate Delta and Close if Limit Exceeded
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // The pull_request payload includes total additions and deletions
            const additions = pr.additions;
            const deletions = pr.deletions;
            
            // Calculate absolute difference between additions and deletions
            const delta = Math.abs(additions - deletions);
            
            console.log(`Additions: ${additions}`);
            console.log(`Deletions: ${deletions}`);
            console.log(`Delta: ${delta}`);
            
            if (delta > 999) {
              const commentBody = `🚨 **PR Automatically Closed:** The delta between line additions and removals (${delta}) exceeds the maximum allowed limit of 999. Please break this up into smaller pull requests.`;
            
              // Leave an explanatory comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: commentBody
              });
            
              // Close the PR
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed'
              });
            
              // Fail the action run
              core.setFailed(`PR delta of ${delta} exceeded the 999 limit.`);
            }
